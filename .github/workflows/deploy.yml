name: Deploy SaaS Bot

on:
  workflow_dispatch:
    inputs:
      bot_username:
        description: 'Bot Username'
        required: true
      cli_token:
        description: 'CLI Login Token'
        required: true
      owner_id:
        description: 'User Telegram ID'
        required: true

jobs:
  deploy-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: TGCloud Deploy
        # هنا نعطي الأداة التوكين بشكل رسمي عبر متغيرات البيئة كما طلبت
        env:
          TGCLOUD_TOKEN: ${{ github.event.inputs.cli_token }}
        run: |
          # إنشاء مجلد البوت (نمرر إنتر فارغ لتجاوز أي أسئلة استباقية)
          echo "" | npm create @tgcloud/bot@latest ${{ github.event.inputs.bot_username }}
          
          # نسخ ملفات مشروعنا (السكرتير) إلى مجلد البوت الجديد
          rm -rf ${{ github.event.inputs.bot_username }}/tgcloud
          cp -r tgcloud ${{ github.event.inputs.bot_username }}/
          
          # الدخول للمجلد، حقن الآيدي الخاص بالمستخدم
          cd ${{ github.event.inputs.bot_username }}
          echo "export const OWNER_ID = \"${{ github.event.inputs.owner_id }}\";" > tgcloud/lib/config.js
          
          # الرفع وتطبيق قاعدة البيانات (الآن الأداة ستسحب التوكين من قسم env تلقائياً)
          npx tgcloud push --force
          npx tgcloud migrate --yes
