name: Deploy SaaS Bot

on:
  workflow_dispatch:
    inputs:
      bot_username:
        description: 'Bot Username'
        required: true
      cli_token:
        description: 'CLI Login Token'
        required: true
      owner_id:
        description: 'User Telegram ID'
        required: true

jobs:
  deploy-bot:
    runs-on: ubuntu-latest
    
    steps:
      # 1. سحب كود المشروع النظيف
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # 2. تجهيز بيئة Node.js (تم التحديث للإصدار 22 لتجاوز التحذير)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. التهيئة والرفع السحابي (محاكاة الأمر الذهبي)
      - name: TGCloud Deploy
        run: |
          # تمرير توكين السحابة تلقائياً لإنشاء مساحة البوت
          echo "${{ github.event.inputs.cli_token }}" | npm create @tgcloud/bot@latest ${{ github.event.inputs.bot_username }}
          
          # نسخ ملفات مشروعنا (السكرتير) إلى مجلد البوت الجديد
          rm -rf ${{ github.event.inputs.bot_username }}/tgcloud
          cp -r tgcloud ${{ github.event.inputs.bot_username }}/
          
          # الدخول للمجلد، حقن الآيدي الخاص بالمستخدم، ثم الرفع وتطبيق قاعدة البيانات
          cd ${{ github.event.inputs.bot_username }}
          echo "export const OWNER_ID = \"${{ github.event.inputs.owner_id }}\";" > tgcloud/lib/config.js
          npx tgcloud push --force
          npx tgcloud migrate
